services:
  postgres:
    image: postgres:16
    container_name: ra-postgres
    environment:
      POSTGRES_USER: ra
      POSTGRES_PASSWORD: ra
      POSTGRES_DB: ra_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ra -d ra_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: ra-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata: