app:
  name: ra-agent
  host: 0.0.0.0  # 监听所有网卡，外部可访问
  port: 8000
  data_dir: ./data  # 本地文件（Chroma 向量库等）统一放这里

database:
  url: postgresql+psycopg://ra:ra@localhost:5432/ra_agent

redis:
  url: redis://localhost:6379/0

vector_store:
  provider: chroma
  chroma:
    persist_dir: ./data/chroma

tracing:
  max_logs: 1000

llm:
  system_default:
    provider: sensenova
    base_url: https://token.sensenova.cn/v1
    model_id: deepseek-v4-flash

embedding:
  default_provider: doubao
  default_model: doubao-embedding-vision
  cloud:
    doubao:
      base_url: https://ark.cn-beijing.volces.com/api/coding/v3
      model_id: doubao-embedding-vision
      dim: 2048
  local:
    default_dim: 384