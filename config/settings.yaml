app:
  name: ra-agent
  host: 0.0.0.0  # 监听所有网卡，外部可访问
  port: 8000
  data_dir: ./data  # 本地文件（Chroma 向量库等）统一放这里

database:
  url: postgresql+psycopg://ra:ra@localhost:5432/ra_agent

redis:
  url: redis://localhost:6379/0

vector_store:
  provider: chroma
  chroma:
    persist_dir: ./data/chroma

tracing:
  max_logs: 1000

llm:
  system_default:
    provider: sensenova
    base_url: https://token.sensenova.cn/v1
    model_id: deepseek-v4-flash
  retry:             # 调用失败退避重试：限流/5xx/网络错误指数退避重试
    max_retries: 3
    base_delay: 1.0 # 首次重试等 1s，之后 2s / 4s（含随机抖动）
  providers:
    sensenova: { base_url: https://token.sensenova.cn/v1, listable: true }
    openai:    { base_url: https://api.openai.com/v1, listable: true }
    qwen:      { base_url: https://dashscope.aliyuncs.com/compatible-mode/v1, listable: true }
    deepseek:  { base_url: https://api.deepseek.com/v1, listable: true }

embedding:
  default_provider: doubao
  default_model: doubao-embedding-vision
  cloud:
    doubao:
      base_url: https://ark.cn-beijing.volces.com/api/coding/v3
      model_id: doubao-embedding-vision
      dim: 2048
      rate_limited: true   # 云端限流：批次间保留间隔防 429
    ollama:
      base_url: http://100.85.4.71:11434/v1
      model_id: qwen3-embedding:8b
      dim: 4096            # 自建端点默认不设批次间隔
  local:
    default_dim: 384

mcp_servers:
  research:
    transport: stdio
    command: python
    args: ["servers/research_server.py"]