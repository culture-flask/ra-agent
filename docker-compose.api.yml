services:
  api:
    build: .
    container_name: verify-api
    environment:
      DATABASE_URL: postgresql+psycopg://ra:ra@postgres:5432/ra_agent   # 服务名，不是 localhost！
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      CHROMA_DIR: /data/chroma
      EMBEDDING_DEFAULT_PROVIDER: local
      JWT_SECRET: dev-secret-change-me-to-32+bytes!!
      RELOAD: "false"             # 容器内关闭热重载
      HTTP_PROXY: ""              # 部署期网络核查：无需代理留空
      HTTPS_PROXY: ""
      NO_PROXY: localhost,127.0.0.1,postgres,redis
      LLM_API_KEY: sk-3Rk7gmkSESEwmQ1UX3C9k5c7pDDfYKRz
    ports:
      - "8002:8000"
    volumes:
      - apidata:/data
    depends_on:
      - postgres
      - redis

volumes:
  apidata: